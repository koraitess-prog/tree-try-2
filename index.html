<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Rust Tree Zoom</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #000; /* רקע שחור מוחלט */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
    }

    .wrapper {
      position: relative;
      width: min(80vw, 80vh);  /* כדי שיתאים גם למסך רחב וגם לגבוה */
      height: min(80vw, 80vh);
    }

    .tree {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1);
      max-width: 100%;
      max-height: 100%;
      height: auto;
      display: block;
    }

    .rust {
      opacity: 0;
      transition: opacity 0.25s ease-out;
      pointer-events: none;
    }

    .debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-size: 12px;
      color: #fff;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <!-- עץ נקי -->
    <img src="tree_clean.png" class="tree" id="treeClean" alt="עץ נקי">

    <!-- עץ חלוד מעליו -->
    <img src="tree_rust.png" class="tree rust" id="treeRust" alt="עץ חלוד">
  </div>

  <div class="debug">
    גלגלי עם הגלגלת: למעלה = יותר חלודה, למטה = פחות.
  </div>

  <script>
    const cleanImg = document.getElementById("treeClean");
    const rustImg  = document.getElementById("treeRust");

    let rustAmount = 0;   // 0 = נקי, 1 = חלוד לגמרי

    window.addEventListener("wheel", (event) => {
      // גלילה למעלה = יותר חלודה, למטה = פחות
      if (event.deltaY < 0) {
        rustAmount += 0.02;   // צעד איטי ורך יותר
      } else {
        rustAmount -= 0.02;
      }

      // לשמור ערך בין 0 ל־1
      rustAmount = Math.max(0, Math.min(1, rustAmount));

      // עקומה עדינה – מתחיל לאט, מתגבר בהמשך
      const eased = rustAmount * rustAmount;

      // כמה החלודה נחשפת
      rustImg.style.opacity = eased;

      // זום עדין – בלי שהעץ יהפוך לעמבה מטושטשת
      const scale = 1 + eased * 0.2;
      const baseTransform = `translate(-50%, -50%) scale(${scale})`;

      cleanImg.style.transform = baseTransform;
      rustImg.style.transform  = baseTransform;
    });
  </script>

</body>
</html>
